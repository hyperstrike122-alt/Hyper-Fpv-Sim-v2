function crash(why){

  say('Crashed',why+' — press R to reset');
}

const PR=0.07; // drone body radius (m): contact only when the quad really touches
function radAt(o,y){ // horizontal radius of the visible shape at height y
  const r=o.r,h=o.h,k=o.k;
  if(k==='pine'){let m=y<h*.35?r*.25:0;for(let i=0;i<4;i++){const c=h*(.3+i*.2),hh=h*.17;if(y>=c-hh&&y<=c+hh)m=Math.max(m,r*(1.5-i*.28)*(c+hh-y)/(2*hh))}return m}
  if(k==='tree'){let m=y<h*.5?r*.26:0;const c=h*.62,ry=r*1.65,t=(y-c)/ry;if(Math.abs(t)<1)m=Math.max(m,r*1.45*Math.sqrt(1-t*t));return m}
  if(k==='rock'){const c=h/2,t=(y-c)/(h/2);return Math.abs(t)<1?r*.88*Math.sqrt(1-t*t):0}
  return r}
function collide(o){
  if(pos.y>=o.h+PR)return null;
  const py=o.h-pos.y,dx=pos.x-o.x,dz=pos.z-o.z;
  if(o.t){const ox=o.w/2+PR-Math.abs(dx),oz=o.d/2+PR-Math.abs(dz);if(ox<=0||oz<=0)return null;
    if(py<ox&&py<oz)return[0,1,0,py+PR];return ox<oz?[Math.sign(dx)||1,0,0,ox]:[0,0,Math.sign(dz)||1,oz];}
  const rr=radAt(o,pos.y);if(rr<=0)return null;
  const dist=Math.hypot(dx,dz),pen=rr+PR-dist;if(pen<=0)return null;
  return(py<pen&&o.k!=='pine'&&o.k!=='tree'&&o.k!=='rock')?[0,1,0,py+PR]:[dx/(dist||1),0,dz/(dist||1),pen];
}
function step(dt){
  const K=k=>keys[k]?1:0,fine=(keys.ShiftLeft||keys.ShiftRight)?0.4:1;
  let tp=clamp(K('ArrowUp')-K('ArrowDown')+K('KeyI')-K('KeyK'),-1,1)*fine,
      tr=clamp(K('ArrowRight')-K('ArrowLeft')+K('KeyL')-K('KeyJ'),-1,1)*fine,
      ty=(K('KeyD')-K('KeyA'))*fine,pad=false,padS=0.5;
  const gp=cfg.src==='pad'?getPad():null;
  if(gp){const m=cfg.map,dz=v=>Math.abs(v)<cfg.dz?0:v;ty=dz(chv(gp,m.yaw));tr=dz(chv(gp,m.roll));tp=dz(chv(gp,m.pitch));padS=clamp((chv(gp,m.thr)+1)/2,0,1);pad=true;}
  simT+=dt;let kw=K('KeyW'),ks=K('KeyS');
  if(cfg.lat>0||cfg.jit>0){lagQ.push([simT,tp,tr,ty,padS,kw,ks]);const tt=simT-(cfg.lat+Math.random()*cfg.jit)/1000;while(lagQ.length>1&&lagQ[1][0]<=tt)lagQ.shift();[,tp,tr,ty,padS,kw,ks]=lagQ[0];}else lagQ.length=0;
  if(!pad)armed=true;
  if(pad){inp.p=tp;inp.r=tr;inp.y=ty;}
  else{inp.p=ramp(inp.p,tp,dt);inp.r=ramp(inp.r,tr,dt);inp.y=ramp(inp.y,ty,dt);}
  if(state==='fly'){
    if(pad){stick=padS;if(!armed){if(padS<0.15){armed=true;say('Raise the throttle to lift off');}else say('Lower the throttle to arm','Your throttle stick is too high');}}
    else if(kw)stick=Math.min(1,stick+dt*1.8);
    else if(ks)stick=Math.max(0,stick-dt*0.8);
    else if(!cfg.kbHold)stick+=clamp(hov()-stick,-3*dt,3*dt);
    {const tg=armed?curve(stick):0;mot+=(tg-mot)*Math.min(1,dt/(PH.lag*(tg>mot?.4:.7)))} // motors spool up faster than they spin down
    thr=Math.min(1,mot/TWR);

    eul.setFromQuaternion(q,'YXZ');
    const RT=rts();let wx=-bf(inp.p,RT.pitch),wz=-bf(inp.r,RT.roll);
    if(mode!=='acro'){
      const ax=clamp((-inp.p*0.95-eul.x)*14,-10,10),az=clamp((-inp.r*0.95-eul.z)*14,-10,10);
      const bp=mode==='angle'?0:Math.min(1,Math.abs(inp.p)*1.25),br=mode==='angle'?0:Math.min(1,Math.abs(inp.r)*1.25);
      wx=ax*(1-bp)+wx*bp;wz=az*(1-br)+wz*br;
    }
    // yaw keeps full authority at any throttle (like Betaflight airmode), so it is the same upside down
    const wy=-bf(inp.y,RT.yaw),k=Math.min(1,dt/(PH.tau*.6));
    // propwash: falling through your own prop wash at low throttle makes the quad wobble
    const vd=-vel.dot(new V3(0,1,0).applyQuaternion(q));
    if(vd>3&&mot<1.2){const pw=Math.min(1,(vd-3)/12)*(1.2-mot)*(1.6-D.a/100)*dt*60;w.x+=(Math.random()-.5)*pw;w.z+=(Math.random()-.5)*pw;}
    w.x+=(wx-w.x)*k;w.y+=(wy-w.y)*k;w.z+=(wz-w.z)*k;
    dq.setFromEuler(new THREE.Euler(w.x*dt,w.y*dt,w.z*dt,'YXZ'));
    q.multiply(dq).normalize();

    const up=new V3(0,1,0).applyQuaternion(q);
    const cu=up.y,fc=clamp((cu-0.2)/0.35,0,1);
    const tm=mot+Math.min(mot,1)*0.3*fc*(1/Math.max(cu,0.5)-1); // slight lift-loss softening when tilted
    const vu=vel.dot(up),a=up.clone().multiplyScalar(tm*G*clamp(1-Math.max(0,vu)/PH.vp,.35,1));a.y-=G; // thrust fades with airflow through the props
    const sp=vel.length();
    // body drag 0.5*rho*CdA*v^2/m, CdA depends on whether air hits the frame edge or the props/underside, plus rotor drag that grows with thrust
    if(sp>1e-3){const c=Math.abs(vu)/sp,cda=PH.cs*(1-c*c)+PH.ct*c*c;a.addScaledVector(vel,-dm()*(0.08+0.02*mot+0.5*RHO*cda/PH.m*sp));}
    vel.addScaledVector(a,dt);
    pos.addScaledVector(vel,dt);

    if(!started&&thr>0.1&&pos.y>0.6){started=true;say('');}
    if(started&&(map.type!=='race'||!fin))time+=dt;

    // ground
    if(pos.y<0.12){
      const flat=new V3(0,1,0).applyQuaternion(q).y;
      if(cfg.crash&&(-vel.y>PH.vc||(flat<0.3&&vel.length()>PH.vc*.29))){pos.y=0.12;crash('Hit the ground');return;}
      pos.y=0.12;vel.y=(!cfg.crash&&vel.y<-1.5)?-vel.y*0.35:Math.max(vel.y,0);vel.x*=1-Math.min(1,dt*4);vel.z*=1-Math.min(1,dt*4);
    }
    for(const o of obs){
      const c=collide(o);if(!c)continue;
      const vn=vel.x*c[0]+vel.y*c[1]+vel.z*c[2];
      if(cfg.crash&&-vn>PH.vc*.45){crash('Hit an obstacle');return;}
      pos.x+=c[0]*c[3];pos.y+=c[1]*c[3];pos.z+=c[2]*c[3];
      if(vn<0){vel.x-=1.4*vn*c[0];vel.y-=1.4*vn*c[1];vel.z-=1.4*vn*c[2];}
    }
    const race=map.type==='race';
    for(const g of race?(!fin&&gi<N?[gates[gi]]:[]):gates){
      const rel=pos.clone().sub(g.p),d=rel.dot(g.n);
      if(g.pd!==null&&g.pd<0&&d>=0&&rel.addScaledVector(g.n,-d).length()<2.3){
        if(race){gi++;colorGates();if(gi===N){
          const lt=time-lapStart,b0=cfg.best[map.id],nbest=(b0==null||lt<b0);if(nbest){cfg.best[map.id]=lt;save();}
          lap++;const L=effLaps();
          if(L>0&&lap>=L){fin=true;say((L===1?'Lap complete ':'Race complete ')+time.toFixed(2)+' s',(L>1?'Best lap '+cfg.best[map.id].toFixed(2)+' s · ':'')+'Press R to fly again');}
          else{lapStart=time;gi=0;gates.forEach(x=>x.pd=null);colorGates();sayTemp('Lap '+lap+': '+lt.toFixed(2)+' s',nbest?'New best lap!':'Best lap '+cfg.best[map.id].toFixed(2)+' s');}
        }}
        else{score++;g.hit=true;colorGates();}
      }
      g.pd=d;
    }
  }
}

// ---- menu music (procedural synthwave, no files needed) ----
const MUS=(()=>{let c,mg,nb,timer=null,st=0,nx=0,want=false,md='menu',run=false;
 const mf=m=>440*Math.pow(2,(m-69)/12),SET={
  menu:{bpm:108,vol:.5,P:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],R:[45,41,36,43]},
  fly:{bpm:126,vol:.26,P:[[62,65,69],[58,62,65],[53,57,60],[60,64,67]],R:[38,34,41,36]}};
 let sp=60/108/4;
 function init(){if(c)return true;try{c=new (window.AudioContext||window.webkitAudioContext)();mg=c.createGain();mg.gain.value=0;mg.connect(c.destination);
  nb=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return true}catch(e){c=null;return false}}
 function tone(t,m,dur,type,vol,fc,att,det){const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();o.type=type;o.frequency.value=mf(m);if(det)o.detune.value=det;
  f.type='lowpass';f.frequency.value=fc;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(f);f.connect(g);g.connect(mg);o.start(t);o.stop(t+dur+.05)}
 function kick(t){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.3)}
 function noise(t,dur,vol,hp){const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();s.buffer=nb;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(mg);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
 function play(i,t){const S=SET[md],bar=(i>>4)&3,k=i&15,ch=S.P[bar];
  if(k===0)ch.forEach((m,j)=>tone(t,m+12,sp*16,'sawtooth',.06,1400,.5,(j-1)*9));
  if(k%4===0)kick(t);
  if(k===4||k===12)noise(t,.14,.35,1500);
  if(k%2===1)noise(t,.04,.12,7000);
  if(k%2===0)tone(t,S.R[bar]+(k===6||k===14?12:0),sp*1.8,'sawtooth',.2,500,.005);
  const arp=[0,1,2,1,2,1,0,2][k>>1&7];if(k%2===0||k%4===3)tone(t,ch[arp]+24,sp*1.6,'square',.05,2200,.004);}
 function tick(){if(!c)return;while(nx<c.currentTime+.3){if(nx<c.currentTime-.2)nx=c.currentTime+.05;play(st,nx);st=(st+1)&63;nx+=sp}}
 return{start(m){m=m||'menu';want=true;if(!cfg.music||!init())return;if(c.state==='suspended')c.resume();
   if(run&&md===m&&mg.gain.value>.01)return;md=m;sp=60/SET[m].bpm/4;run=true;
   const t=c.currentTime;mg.gain.cancelScheduledValues(t);mg.gain.setValueAtTime(mg.gain.value,t);mg.gain.linearRampToValueAtTime(SET[m].vol,t+1.2);
   if(!timer){nx=t+.1;timer=setInterval(tick,60)}},
  stop(){want=false;run=false;if(!c)return;const t=c.currentTime;mg.gain.cancelScheduledValues(t);mg.gain.setValueAtTime(mg.gain.value,t);mg.gain.linearRampToValueAtTime(0,t+.5);
   setTimeout(()=>{if(!want&&timer){clearInterval(timer);timer=null}},700)},
  hidden(h){if(!c)return;if(h)c.suspend();else if(want)c.resume()}}})();
document.addEventListener('visibilitychange',()=>MUS.hidden(document.hidden));

function ratesUI(el){
 const AX=[['roll','Roll','#ff7a59'],['pitch','Pitch','#5dffa0'],['yaw','Yaw','#7aa7ff']],RG=[[.1,2.55],[0,.95],[0,1]];
 el.innerHTML=`<div class="hint" style="opacity:.7;font-size:.85em;margin-bottom:6px">${DRONES[sel.drone].n}: Betaflight-style rates (RC rate, super rate, expo)</div><canvas class="rg" width="300" height="130"></canvas><table class="rt"><tr><th></th><th>RC rate</th><th>Super</th><th>Expo</th><th>Max</th></tr>${AX.map(([k,n,c])=>`<tr><td style="color:${c}">${n}</td>${RG.map((r,i)=>`<td><input type="range" min="${r[0]}" max="${r[1]}" step="0.01" data-a="${k}" data-i="${i}"></td>`).join('')}<td data-m="${k}"></td></tr>`).join('')}</table><div class="row"><button data-all style="background:#222b39;color:var(--fg);border:1px solid #fff4;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer;margin-right:6px">Use for all drones</button><button data-reset style="background:#222b39;color:var(--fg);border:1px solid #fff4;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer">Reset to drone defaults</button><span data-sv style="margin-left:8px;opacity:.7;font-size:.85em"></span></div>`;
 const R0=rts(),cx=el.querySelector('canvas').getContext('2d');
 el.querySelectorAll('input').forEach(e=>e.value=R0[e.dataset.a][+e.dataset.i]);
 const draw=()=>{const R=rts();cx.clearRect(0,0,300,130);cx.strokeStyle='#fff3';cx.strokeRect(.5,.5,299,129);
  const mx=Math.max(900,...AX.map(([k])=>bf(1,R[k])*57.3));
  AX.forEach(([k,,c])=>{cx.strokeStyle=c;cx.lineWidth=2;cx.beginPath();for(let i=0;i<=40;i++){const x=i/40;cx[i?'lineTo':'moveTo'](x*300,128-bf(x,R[k])*57.3/mx*124)}cx.stroke();el.querySelector('[data-m="'+k+'"]').textContent=Math.round(bf(1,R[k])*57.3)+'°/s'})};
 const sv=()=>{el.querySelector('[data-sv]').textContent=saveOK?'Saved':'Not saved (browser blocks storage)'};
 el.oninput=e=>{const t=e.target;if(!t.dataset.a)return;rts()[t.dataset.a][+t.dataset.i]=+t.value;save();draw();sv()};
 el.querySelector('[data-all]').onclick=()=>{const R=JSON.parse(JSON.stringify(rts()));for(const k in DRONES)cfg.rates[k]=JSON.parse(JSON.stringify(R));save();sv();el.querySelector('[data-sv]').textContent='Applied to all drones'};
 el.querySelector('[data-reset]').onclick=()=>{delete cfg.rates[sel.drone];save();ratesUI(el)};
 draw();
}
const card=(k,t,d,on,x='')=>`<button class="card${on?' on':''}" data-k="${k}"><b>${t}</b><span>${d}</span>${x}</button>`;
const sbar=(l,v)=>`<div class="st"><em>${l}</em><i style="--v:${v}"></i></div>`;
function lapsUI(){
 const m=MAPS.find(x=>x.id===sel.map);
 if(m&&m.p2p)return '<div class="laps"><b>Laps</b><small>This is a point-to-point track: one run from start to finish.</small></div>';
 const L=cfg.laps,btn=(v,t)=>`<button data-l="${v}" class="${L===v?'on':''}">${t}</button>`;
 return `<div class="laps"><b>Laps</b>${[1,3,5,10].map(v=>btn(v,v)).join('')}${btn(0,'Infinite')}<span>or</span><input type="number" id="lapn" min="1" max="99" value="${L||''}" placeholder="#"></div>`}
function plUI(){const d=DRONES[sel.drone],pl=maxPl(sel.drone,cfg.pl||0),P=phys(d,pl);
 return `<div class="laps"><b>Added weight</b>${PLS.map(v=>`<button data-pl="${v}" class="${pl===v?'on':''}"${okPl(d,v)?'':' disabled'}>+${v} g</button>`).join('')}<small>${d.w+pl} g total · ${P.twr.toFixed(1)}:1 thrust · top ~${Math.round(topKmh(d,pl))} km/h</small></div>`}
function renderStart(){
 const st=$('start');let body='',ok=false;
 if(stage===0){ok=!!sel.mode;body='<div class="cards">'+card('race','Race','Fly the gates against the clock and chase your best lap.',sel.mode==='race')+card('free','Freestyle','No timer. Fly free, dive buildings and hit gates your way.',sel.mode==='free')+'</div>';}
 else if(stage===1){ok=true;body='<div class="cards">'+Object.entries(DRONES).map(([k,d])=>card(k,d.n,d.d,sel.drone===k,`<div class="st"><em>Weight</em>${d.w} g</div><div class="st"><em>Thrust</em>${d.twr}:1</div><div class="st"><em>Top</em>${Math.round(topKmh(d,0))} km/h</div>`+sbar('Speed',Math.min(100,Math.round(topKmh(d,0)/2)))+sbar('Agility',d.a))).join('')+'</div>'+plUI()+'<div id="rtp"><details><summary>Rates (Betaflight style)</summary><div id="rtb"></div></details></div>';}
 else{ok=!!sel.map;body='<div class="cards">'+MAPS.filter(m=>m.type===sel.mode).map(m=>card(m.id,m.n,m.d,sel.map===m.id)).join('')+'</div>';}
 st.innerHTML=`<div id="sw"><h1><span class="t1">THE HYPER</span> <span class="t2">FPV SIM</span></h1><div class="tag">Fly fast. Fly free.</div><div class="crumbs">${['Game mode','Drone','Map'].map((n,i)=>`<span class="${i===stage?'on':i<stage?'done':''}">${i+1}. ${n}</span>`).join('')}</div>${body}${stage===2&&sel.mode==='race'?lapsUI():''}<div class="nav">${stage?'<button id="bk">Back</button>':''}<button id="nx" class="${stage===2?'go':''}" ${ok?'':'disabled'}>${stage===2?'Fly':'Next'}</button><button id="ct">Crashing: ${cfg.crash?'On':'Off'}</button><button id="mu">Music: ${cfg.music?'On':'Off'}</button><button id="sc">Controller setup</button></div></div>`;
 st.querySelectorAll('.card').forEach(c=>c.onclick=()=>{const k=c.dataset.k;
  if(stage===0){if(sel.mode!==k)sel.map='';sel.mode=k}else if(stage===1){sel.drone=k;cfg.last={drone:k};cfg.pl=maxPl(k,cfg.pl||0);save()}else{sel.map=k;buildMap(MAPS.find(m=>m.id===k))}
  renderStart()});
 st.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{cfg.pl=+b.dataset.pl;save();renderStart()});
 st.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{cfg.laps=+b.dataset.l;save();renderStart()});
 if($('lapn'))$('lapn').onchange=e=>{cfg.laps=clamp(Math.round(+e.target.value)||1,1,99);save();renderStart()};
 $('nx').onclick=()=>{if(stage<2){stage++;renderStart()}else launch()};
 if($('bk'))$('bk').onclick=()=>{stage--;renderStart()};
 $('sc').onclick=()=>toggleMenu(true);$('ct').onclick=()=>{cfg.crash=!cfg.crash;save();renderStart()};$('mu').onclick=()=>{cfg.music=!cfg.music;save();cfg.music?MUS.start('menu'):MUS.stop();renderStart()};
 const dt=st.querySelector('details');if(dt){dt.open=rtOpen;dt.ontoggle=()=>{rtOpen=dt.open};ratesUI($('rtb'));}
}
function showStart(){if(cfg.music)MUS.start('menu');inMenu=true;stage=0;$('start').hidden=false;$('hud').style.display='none';$('mbtn').style.display='none';renderStart();}
function launch(){
 audio();if(cfg.music)MUS.start('fly');
 D=DRONES[sel.drone];PH=phys(D,maxPl(sel.drone,cfg.pl||0));TWR=PH.twr;$('wt').textContent=Math.round(PH.m*1000);tiltI=TILTS.reduce((b,t,i)=>Math.abs(t-D.tilt)<Math.abs(TILTS[b]-D.tilt)?i:b,0);
 buildMap(MAPS.find(m=>m.id===sel.map));$('start').hidden=true;$('hud').style.display='';$('mbtn').style.display='';inMenu=false;reset();
}
try{showStart()}catch(e){__err('menu: '+e.message)}

function videoPose(){const n=performance.now(),L=cfg.vlat||0;if(L<=0){vQ.length=0;return{p:pos,q:q}}
 vQ.push({t:n,p:pos.clone(),q:q.clone()});const tt=n-L;while(vQ.length>1&&vQ[1].t<=tt)vQ.shift();return vQ[0]}
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.033);
  try{if(!menuOpen&&!inMenu){step(dt*0.5);step(dt*0.5);}}catch(e){__err('physics: '+e.message)}
  if(inMenu){const t=performance.now()/7000;cam.fov=60;cam.updateProjectionMatrix();cam.position.set(mapCenter.x+Math.sin(t)*55,18,mapCenter.z+Math.cos(t)*55);cam.lookAt(mapCenter);}else{const vp=videoPose();cam.position.copy(vp.p);cam.fov=cfg.fov+Math.min(14,vel.length()*0.18);cam.updateProjectionMatrix();
  tiltQ.setFromAxisAngle(new V3(1,0,0),TILTS[tiltI]*Math.PI/180);
  cam.quaternion.copy(vp.q).multiply(tiltQ);}
  dome.position.copy(cam.position);try{ren.render(scene,cam)}catch(e){__err('render: '+e.message)}
  try{engineUpdate();
  $('time').textContent=time.toFixed(2);
  const rc=map.type==='race';$('time').style.display=rc?'':'none';$('gl').textContent=rc?'Gate':'Gates passed';$('gnw').style.display=rc?'':'none';$('gate').textContent=rc?gi:score;$('tl2').style.display=(rc||N)?'':'none';$('best').textContent=rc&&cfg.best[map.id]!=null?'best lap '+cfg.best[map.id].toFixed(2):'';{const L=effLaps();$('lap').textContent=rc?'Lap '+(fin?lap:lap+1)+(L?'/'+L:'')+'  ':'';}
  $('mode').textContent=mode.toUpperCase();
  $('cam').textContent=TILTS[tiltI];
  $('spd').textContent=Math.round(vel.length()*3.6);
  $('alt').textContent=Math.max(0,pos.y-0.12).toFixed(1);
  $('tb').style.width=(stick*100)+'%';$('thr').style.setProperty('--hv',(hov()*100)+'%');}catch(e){__err('hud: '+e.message)}
}
loop();
</script></body></html>
